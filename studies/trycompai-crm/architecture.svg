<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#eef3fa"/>
    </linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7f0ff"/>
      <stop offset="1" stop-color="#d7e5ff"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9fbf5"/>
      <stop offset="1" stop-color="#d6f3e9"/>
    </linearGradient>
    <linearGradient id="rules" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff5dc"/>
      <stop offset="1" stop-color="#ffebbc"/>
    </linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5ecff"/>
      <stop offset="1" stop-color="#eadbff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e2b44" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#53657d"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3977d3"/>
    </marker>
    <style>
      .cn { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .title { font-size: 38px; font-weight: 700; fill: #17243a; }
      .subtitle { font-size: 20px; fill: #5b6b82; }
      .box-title { font-size: 25px; font-weight: 700; fill: #1d2a40; }
      .box-sub { font-size: 17px; fill: #66758a; }
      .item { font-size: 19px; fill: #26364d; }
      .small { font-size: 16px; fill: #57687e; }
      .label { font-size: 17px; font-weight: 700; fill: #40536d; }
      .step { font-size: 18px; font-weight: 700; fill: #fff; }
      .footer-title { font-size: 23px; font-weight: 700; fill: #17243a; }
      .footer-item { font-size: 18px; fill: #32455f; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="url(#bg)"/>
  <circle cx="1480" cy="90" r="170" fill="#dce8fb" opacity="0.45"/>
  <circle cx="80" cy="1020" r="220" fill="#dcefe8" opacity="0.45"/>

  <text x="800" y="66" text-anchor="middle" class="cn title">Agentic CRM 核心理解</text>
  <text x="800" y="101" text-anchor="middle" class="cn subtitle">把必要业务数据沉淀为“可验证、可关联、可调度、可回流”的 Agent 长期记忆</text>

  <!-- Sources -->
  <g filter="url(#shadow)">
    <rect x="55" y="185" width="290" height="540" rx="24" fill="#ffffff" stroke="#cbd5e3" stroke-width="2"/>
  </g>
  <circle cx="100" cy="230" r="22" fill="#53657d"/>
  <text x="100" y="237" text-anchor="middle" class="cn step">1</text>
  <text x="135" y="238" class="cn box-title">业务信息进入</text>
  <text x="84" y="280" class="cn box-sub">数据源不是只有文档</text>

  <g class="cn item">
    <rect x="82" y="310" width="236" height="64" rx="14" fill="#f1f5fa"/>
    <text x="106" y="349">✉ 邮件与签名档</text>
    <rect x="82" y="389" width="236" height="64" rx="14" fill="#f1f5fa"/>
    <text x="106" y="428">▣ 日历与会议</text>
    <rect x="82" y="468" width="236" height="64" rx="14" fill="#f1f5fa"/>
    <text x="106" y="507">◎ 网站访问与表单</text>
    <rect x="82" y="547" width="236" height="64" rx="14" fill="#f1f5fa"/>
    <text x="106" y="586">✎ 人工录入与修正</text>
    <rect x="82" y="626" width="236" height="64" rx="14" fill="#f1f5fa"/>
    <text x="106" y="665">⌕ 公开网络与数据源</text>
  </g>

  <!-- Database -->
  <g filter="url(#shadow)">
    <rect x="425" y="145" width="500" height="620" rx="28" fill="url(#db)" stroke="#79a5e8" stroke-width="2.5"/>
  </g>
  <circle cx="472" cy="194" r="22" fill="#3977d3"/>
  <text x="472" y="201" text-anchor="middle" class="cn step">2</text>
  <text x="507" y="202" class="cn box-title">Agent-ready Database</text>
  <text x="465" y="239" class="cn box-sub">不是“堆数据”，而是沉淀可供 Agent 使用的业务状态</text>

  <g class="cn">
    <rect x="460" y="275" width="430" height="100" rx="16" fill="#ffffff" opacity="0.88"/>
    <text x="486" y="309" class="box-title" font-size="21">A. 已确认的业务事实</text>
    <text x="486" y="340" class="item">联系人、公司、职位、商机、邮件、会议</text>
    <text x="486" y="363" class="small">回答：现在业务上“认可什么是真的”</text>

    <rect x="460" y="392" width="430" height="100" rx="16" fill="#ffffff" opacity="0.88"/>
    <text x="486" y="426" class="box-title" font-size="21">B. 证据与事实状态</text>
    <text x="486" y="457" class="item">来源、强弱、冲突、建议、人工确认</text>
    <text x="486" y="480" class="small">回答：为什么相信，以及谁做过决定</text>

    <rect x="460" y="509" width="430" height="100" rx="16" fill="#ffffff" opacity="0.88"/>
    <text x="486" y="543" class="box-title" font-size="21">C. 关系与业务历史</text>
    <text x="486" y="574" class="item">人—公司—商机—互动—时间线</text>
    <text x="486" y="597" class="small">回答：对象之间如何关联、发生过什么</text>

    <rect x="460" y="626" width="430" height="100" rx="16" fill="#ffffff" opacity="0.88"/>
    <text x="486" y="660" class="box-title" font-size="21">D. Agent 运行状态</text>
    <text x="486" y="691" class="item">任务、dueAt、预算、权限、版本、审计</text>
    <text x="486" y="714" class="small">回答：接下来什么时候、由谁、允许做什么</text>
  </g>

  <!-- Rules -->
  <g filter="url(#shadow)">
    <rect x="1005" y="145" width="535" height="250" rx="26" fill="url(#rules)" stroke="#e2b957" stroke-width="2.5"/>
  </g>
  <circle cx="1051" cy="194" r="22" fill="#c58a12"/>
  <text x="1051" y="201" text-anchor="middle" class="cn step">3</text>
  <text x="1086" y="202" class="cn box-title">确定性规则与治理</text>
  <g class="cn item">
    <text x="1043" y="251">✓ 强证据自动写入，弱证据转人工建议</text>
    <text x="1043" y="289">✓ 不覆盖人工值；冲突事实暂不写入</text>
    <text x="1043" y="327">✓ 数据范围、工具、动作、预算显式授权</text>
    <text x="1043" y="365">✓ 幂等、重试、审计和成本由程序保证</text>
  </g>

  <!-- Agent -->
  <g filter="url(#shadow)">
    <rect x="1005" y="440" width="535" height="325" rx="26" fill="url(#agent)" stroke="#67b99c" stroke-width="2.5"/>
  </g>
  <circle cx="1051" cy="489" r="22" fill="#24876a"/>
  <text x="1051" y="496" text-anchor="middle" class="cn step">4</text>
  <text x="1086" y="497" class="cn box-title">大模型 Agent 调度使用</text>
  <text x="1043" y="538" class="cn box-sub">模型不直接连接数据库，只能通过受控工具工作</text>

  <g class="cn">
    <rect x="1043" y="565" width="218" height="72" rx="15" fill="#ffffff" opacity="0.9"/>
    <text x="1064" y="593" class="label">读取上下文</text>
    <text x="1064" y="620" class="small">按对象和关系检索</text>

    <rect x="1281" y="565" width="218" height="72" rx="15" fill="#ffffff" opacity="0.9"/>
    <text x="1302" y="593" class="label">理解与规划</text>
    <text x="1302" y="620" class="small">判断缺什么、下一步查什么</text>

    <rect x="1043" y="654" width="218" height="72" rx="15" fill="#ffffff" opacity="0.9"/>
    <text x="1064" y="682" class="label">调用受控工具</text>
    <text x="1064" y="709" class="small">查询、提取、创建动作</text>

    <rect x="1281" y="654" width="218" height="72" rx="15" fill="#ffffff" opacity="0.9"/>
    <text x="1302" y="682" class="label">安排未来任务</text>
    <text x="1302" y="709" class="small">持续运行而非一次聊天</text>
  </g>

  <!-- Arrows top flow -->
  <path d="M 345 455 C 370 455, 390 455, 425 455" fill="none" stroke="#53657d" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="383" y="438" text-anchor="middle" class="cn label">结构化</text>

  <path d="M 925 275 C 960 275, 970 275, 1005 275" fill="none" stroke="#53657d" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="965" y="258" text-anchor="middle" class="cn label">治理</text>

  <path d="M 1272 395 L 1272 440" fill="none" stroke="#53657d" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1292" y="422" class="cn label">约束</text>

  <path d="M 1005 600 C 973 600, 958 600, 925 600" fill="none" stroke="#3977d3" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="965" y="583" text-anchor="middle" class="cn label">按需读取</text>

  <!-- Results and feedback -->
  <g filter="url(#shadow)">
    <rect x="245" y="830" width="1110" height="160" rx="28" fill="url(#result)" stroke="#a57bd6" stroke-width="2.5"/>
  </g>
  <circle cx="295" cy="875" r="22" fill="#7f50b5"/>
  <text x="295" y="882" text-anchor="middle" class="cn step">5</text>
  <text x="331" y="883" class="cn box-title">执行结果回流，形成业务闭环</text>

  <g class="cn item">
    <rect x="291" y="911" width="220" height="48" rx="12" fill="#ffffff" opacity="0.86"/>
    <text x="401" y="942" text-anchor="middle">更新可信字段</text>
    <rect x="526" y="911" width="220" height="48" rx="12" fill="#ffffff" opacity="0.86"/>
    <text x="636" y="942" text-anchor="middle">提交人工建议</text>
    <rect x="761" y="911" width="220" height="48" rx="12" fill="#ffffff" opacity="0.86"/>
    <text x="871" y="942" text-anchor="middle">创建任务与提醒</text>
    <rect x="996" y="911" width="310" height="48" rx="12" fill="#ffffff" opacity="0.86"/>
    <text x="1151" y="942" text-anchor="middle">沉淀运行、成本与审计记录</text>
  </g>

  <path d="M 1272 765 C 1272 795, 1190 805, 1120 830" fill="none" stroke="#53657d" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1250" y="803" class="cn label">产生结果</text>

  <path d="M 455 830 C 395 795, 505 785, 600 765" fill="none" stroke="#3977d3" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="460" y="798" class="cn label">写回数据库，成为下一轮上下文</text>

  <!-- Final mental model -->
  <rect x="245" y="1020" width="1110" height="66" rx="20" fill="#17243a"/>
  <text x="800" y="1061" text-anchor="middle" class="cn" font-size="20" font-weight="700" fill="#ffffff">
    数据库＝长期记忆　｜　规则＝可信与安全护栏　｜　大模型＝理解和规划　｜　任务队列＝持续运行　｜　工具＝受控双手
  </text>
</svg>
