name: Validate repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check required entry files
        shell: bash
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f studies/README.md
          test -f templates/study/README.md
          test -f docs/index.md
