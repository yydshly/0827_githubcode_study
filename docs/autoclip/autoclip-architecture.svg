<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">AutoClip 字幕驱动的视频粗剪技术架构</title>
  <desc id="desc">展示 AutoClip 从视频导入、字幕或语音转写、LLM 语义处理、时间码映射到 FFmpeg 切割输出的完整链路，以及应用架构、能力边界和精度升级方向。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131b"/>
      <stop offset="0.52" stop-color="#0b1922"/>
      <stop offset="1" stop-color="#101729"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#50e3c2" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6fa8ff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="semantic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142c32"/>
      <stop offset="1" stop-color="#12243c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6ee7cc"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78a9ff"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #edf7f6; }
      .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 2px; fill: #72e4cd; }
      .title { font-size: 46px; font-weight: 760; letter-spacing: -1px; }
      .subtitle { font-size: 21px; fill: #b9ccc9; }
      .section { font-size: 18px; font-weight: 700; letter-spacing: 1px; fill: #8fe8d5; }
      .box-title { font-size: 22px; font-weight: 720; }
      .box-sub { font-size: 16px; fill: #a9bfbd; }
      .step { font-size: 18px; font-weight: 700; }
      .detail { font-size: 15px; fill: #afc3c1; }
      .tiny { font-size: 14px; fill: #91aaa8; }
      .strong { font-size: 17px; font-weight: 700; fill: #f6fbfa; }
      .mint { fill: #70e5cd; }
      .blue { fill: #83b1ff; }
      .amber { fill: #f2c16e; }
      .rose { fill: #ff9cae; }
      .box { fill: #102129; stroke: #29424a; stroke-width: 1.5; }
      .box-blue { fill: #111f34; stroke: #30496d; stroke-width: 1.5; }
      .box-amber { fill: #292318; stroke: #5e4d2e; stroke-width: 1.5; }
      .box-rose { fill: #291c26; stroke: #5a3444; stroke-width: 1.5; }
      .chip { fill: #13272b; stroke: #2f5556; stroke-width: 1; }
      .line { stroke: #6ee7cc; stroke-width: 3; fill: none; marker-end: url(#arrow-mint); }
      .line-blue { stroke: #78a9ff; stroke-width: 2.5; fill: none; marker-end: url(#arrow-blue); }
      .dash { stroke: #496267; stroke-width: 2; stroke-dasharray: 7 7; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="url(#bg)"/>
  <circle cx="1415" cy="-30" r="330" fill="#3866a8" opacity="0.1"/>
  <circle cx="100" cy="1050" r="320" fill="#1e9a83" opacity="0.08"/>

  <rect x="52" y="42" width="1496" height="116" rx="22" fill="url(#hero)" stroke="#25444b"/>
  <text x="82" y="78" class="eyebrow">AUTOCLIP · TECHNICAL ARCHIVE · v1.2.0</text>
  <text x="82" y="123" class="title">字幕驱动的 AI 选段与视频粗剪系统</text>
  <text x="1045" y="91" class="subtitle">AI 理解“说了什么”</text>
  <text x="1045" y="123" class="subtitle">FFmpeg 执行“剪哪里”</text>

  <text x="56" y="200" class="section">01 · 核心处理链路</text>

  <g filter="url(#shadow)">
    <rect class="box" x="56" y="222" width="214" height="178" rx="18"/>
    <text x="78" y="253" class="box-title">素材进入</text>
    <text x="78" y="286" class="detail">• B站 / YouTube</text>
    <text x="78" y="311" class="detail">• 本地视频文件</text>
    <text x="78" y="336" class="detail">• 可选 SRT 字幕</text>
    <rect class="chip" x="78" y="354" width="166" height="27" rx="7"/>
    <text x="91" y="373" class="tiny">yt-dlp · 平台接口</text>

    <rect class="box" x="310" y="222" width="238" height="178" rx="18"/>
    <text x="332" y="253" class="box-title">字幕时间轴</text>
    <text x="332" y="286" class="detail">优先读取已有 SRT</text>
    <text x="332" y="311" class="detail">否则本地语音转写</text>
    <text x="332" y="336" class="detail">输出 start / end / text</text>
    <rect class="chip" x="332" y="354" width="190" height="27" rx="7"/>
    <text x="345" y="373" class="tiny">faster-whisper · ASR</text>

    <rect x="588" y="222" width="594" height="390" rx="22" fill="url(#semantic)" stroke="#31585d" stroke-width="1.5"/>
    <text x="614" y="254" class="box-title">LLM 语义处理流水线</text>
    <text x="1128" y="254" text-anchor="end" class="tiny">输入是字幕文本，不是视频像素</text>

    <rect class="chip" x="614" y="278" width="258" height="84" rx="14"/>
    <text x="634" y="307" class="step">① 分块与大纲</text>
    <text x="634" y="335" class="detail">约 30 分钟分块 · 话题提取</text>

    <rect class="chip" x="892" y="278" width="264" height="84" rx="14"/>
    <text x="912" y="307" class="step">② 时间线映射</text>
    <text x="912" y="335" class="detail">话题 → 字幕起止时间</text>

    <rect class="chip" x="614" y="380" width="258" height="84" rx="14"/>
    <text x="634" y="409" class="step">③ 高光评分</text>
    <text x="634" y="437" class="detail">信息 · 情绪 · 传播 · 完整性</text>

    <rect class="chip" x="892" y="380" width="264" height="84" rx="14"/>
    <text x="912" y="409" class="step">④ 标题生成</text>
    <text x="912" y="437" class="detail">批量生成 · 失败回退</text>

    <rect class="chip" x="614" y="482" width="542" height="84" rx="14"/>
    <text x="634" y="511" class="step">⑤ 主题合集</text>
    <text x="634" y="539" class="detail">关键词预聚类 + LLM 组合 → 标题、简介、有序 clip_ids</text>
    <text x="614" y="593" class="tiny">模型可配置：DashScope/Qwen · OpenAI · Gemini · SiliconFlow</text>

    <rect class="box-blue" x="1222" y="222" width="322" height="390" rx="22"/>
    <text x="1248" y="254" class="box-title">确定性媒体执行</text>
    <text x="1248" y="292" class="strong blue">FFprobe</text>
    <text x="1248" y="318" class="detail">时长、编码、关键帧与媒体探测</text>
    <line x1="1248" y1="340" x2="1516" y2="340" stroke="#30496d"/>
    <text x="1248" y="375" class="strong blue">FFmpeg</text>
    <text x="1248" y="401" class="detail">• 单片段按时间码切割</text>
    <text x="1248" y="426" class="detail">• 合集拼接 / H.264 + AAC</text>
    <text x="1248" y="451" class="detail">• 转码与缩略图抽帧</text>
    <line x1="1248" y1="474" x2="1516" y2="474" stroke="#30496d"/>
    <text x="1248" y="507" class="strong">输出产物</text>
    <text x="1248" y="535" class="detail">MP4 切片 · 合集视频</text>
    <text x="1248" y="560" class="detail">缩略图 · JSON 元数据</text>
    <text x="1248" y="589" class="tiny">stream copy 快；重编码切点更准</text>
  </g>

  <path class="line" d="M270 311 H300"/>
  <path class="line" d="M548 311 H578"/>
  <path class="line" d="M1182 417 H1212"/>

  <rect x="56" y="432" width="492" height="180" rx="18" class="box-amber"/>
  <text x="78" y="465" class="box-title amber">关键解释：嘴部一致性</text>
  <text x="78" y="497" class="detail">片段内部直接保留原视频的音频和画面，</text>
  <text x="78" y="522" class="detail">所以原有口型同步通常不会被破坏。</text>
  <text x="78" y="555" class="detail">未处理的是：切断字句、表情跳变、镜头跳切、</text>
  <text x="78" y="580" class="detail">关键帧偏差。它没有生成或修复嘴型。</text>

  <text x="56" y="666" class="section">02 · 应用与运行架构</text>

  <g>
    <rect class="box" x="56" y="690" width="350" height="178" rx="18"/>
    <text x="80" y="724" class="box-title">产品层</text>
    <text x="80" y="758" class="strong mint">React + TypeScript</text>
    <text x="80" y="784" class="detail">项目、切片、合集、设置与进度</text>
    <text x="80" y="817" class="strong mint">Tauri 桌面端</text>
    <text x="80" y="843" class="detail">本地运行、桌面打包、隐私数据留本机</text>

    <rect class="box" x="440" y="690" width="350" height="178" rx="18"/>
    <text x="464" y="724" class="box-title">服务与任务层</text>
    <text x="464" y="758" class="strong mint">FastAPI</text>
    <text x="464" y="784" class="detail">项目 API、配置与处理入口</text>
    <text x="464" y="817" class="strong mint">Celery + Redis / 本地任务</text>
    <text x="464" y="843" class="detail">服务端异步处理 / 桌面进度事件</text>

    <rect class="box" x="824" y="690" width="350" height="178" rx="18"/>
    <text x="848" y="724" class="box-title">数据与资产层</text>
    <text x="848" y="758" class="strong mint">SQLite</text>
    <text x="848" y="784" class="detail">项目、片段、合集与任务状态</text>
    <text x="848" y="817" class="strong mint">项目文件目录</text>
    <text x="848" y="843" class="detail">视频、字幕、JSON、中间产物和输出</text>

    <rect class="box-rose" x="1208" y="690" width="336" height="178" rx="18"/>
    <text x="1232" y="724" class="box-title rose">能力边界</text>
    <text x="1232" y="758" class="detail">× 非直接视觉高光识别</text>
    <text x="1232" y="784" class="detail">× 非逐词强制对齐 / VAD 精剪</text>
    <text x="1232" y="810" class="detail">× 非口型生成、B-roll、花字与转场</text>
    <text x="1232" y="836" class="detail">× 非自动竖屏重构与人脸跟踪</text>
  </g>

  <path class="line-blue" d="M406 779 H430"/>
  <path class="line-blue" d="M790 779 H814"/>
  <path class="dash" d="M1174 779 H1198"/>

  <text x="56" y="926" class="section">03 · 从粗剪到精剪的升级路线</text>

  <g>
    <rect class="box" x="56" y="950" width="270" height="116" rx="16"/>
    <text x="78" y="982" class="step mint">L1 · 当前能力</text>
    <text x="78" y="1010" class="detail">SRT + LLM + FFmpeg</text>
    <text x="78" y="1037" class="tiny">快速找到“讲了什么”</text>

    <rect class="box-blue" x="360" y="950" width="270" height="116" rx="16"/>
    <text x="382" y="982" class="step blue">L2 · 语音边界</text>
    <text x="382" y="1010" class="detail">逐词时间戳 + VAD + 对齐</text>
    <text x="382" y="1037" class="tiny">不切断字、停顿和句子</text>

    <rect class="box-blue" x="664" y="950" width="270" height="116" rx="16"/>
    <text x="686" y="982" class="step blue">L3 · 多模态理解</text>
    <text x="686" y="1010" class="detail">镜头 + 人脸 + 动作 + 声学</text>
    <text x="686" y="1037" class="tiny">理解“画面发生了什么”</text>

    <rect class="box-blue" x="968" y="950" width="270" height="116" rx="16"/>
    <text x="990" y="982" class="step blue">L4 · 业务排序</text>
    <text x="990" y="1010" class="detail">人工选择 + 完播/互动反馈</text>
    <text x="990" y="1037" class="tiny">校准真正值得发布的片段</text>

    <rect class="box-amber" x="1272" y="950" width="272" height="116" rx="16"/>
    <text x="1294" y="982" class="step amber">L5 · 自动成片</text>
    <text x="1294" y="1010" class="detail">构图 + J/L Cut + 包装 + 合规</text>
    <text x="1294" y="1037" class="tiny">从候选片段升级为发布成片</text>
  </g>

  <path class="line-blue" d="M326 1008 H350"/>
  <path class="line-blue" d="M630 1008 H654"/>
  <path class="line-blue" d="M934 1008 H958"/>
  <path class="line-blue" d="M1238 1008 H1262"/>

  <text x="56" y="1100" class="tiny">适合：访谈 · 播客 · 课程 · 直播回放 · 观点解说　｜　不适合直接替代：体育/游戏视觉高光 · 专业成片 · 生成式口型同步</text>
  <text x="1544" y="1100" text-anchor="end" class="tiny">归档日期 2026-08-27</text>
</svg>
